    let map;
    let clusterer;
    let currentCenter = { lat: 37.5045, lng: 127.0485 };
    let currentOverlay = null;

    function initMap() {
        loadMasterData();

        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(currentCenter.lat, currentCenter.lng),
            level: 4
        };
        map = new kakao.maps.Map(mapContainer, mapOption);
        
        kakao.maps.event.addListener(map, 'click', function() {
            if (currentOverlay) {
                currentOverlay.setMap(null);
                currentOverlay = null;
            }
        });

        clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 5
        });

        updateAllDistances(currentCenter.lat, currentCenter.lng);
        applyCurrentFilterAndRender();
    }

    // [정밀 연동] 상호명 키워드 검색 전용 카카오맵 링크 생성
    function getMapLink(item) {
        return `https://map.kakao.com/link/search/${encodeURIComponent(item.name)}`;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function updateAllDistances(lat, lng) {
        masterFranchiseData.forEach(item => {
            item.distance = getDistance(lat, lng, item.lat, item.lng);
        });
    }

    function sortByMyPosition() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                currentCenter = { lat: userLat, lng: userLng };
                
                const moveLatLon = new kakao.maps.LatLng(userLat, userLng);
                map.setCenter(moveLatLon);

                updateAllDistances(userLat, userLng);
                masterFranchiseData.sort((a, b) => a.distance - b.distance);

                applyCurrentFilterAndRender();
            }, function() {
                alert('위치 정보를 가져올 수 없습니다.');
            });
        } else {
            alert('위치 정보를 지원하지 않는 브라우저입니다.');
        }
    }

    function renderMarkersAndCluster(data) {
        clusterer.clear();

        const markers = data.map((item) => {
            const coords = new kakao.maps.LatLng(item.lat, item.lng);
            const marker = new kakao.maps.Marker({ position: coords });
            const targetUrl = getMapLink(item);

            const content = document.createElement('div');
            content.className = 'soft-box-bubble';
            content.innerHTML = `
                <span class="shop-name">${item.name}</span>
                <span class="shop-info">📞 ${item.phone}</span>
            `;

            content.onclick = function(e) {
                e.stopPropagation();
                window.open(targetUrl, '_blank');
            };

            const customOverlay = new kakao.maps.CustomOverlay({
                position: coords,
                content: content,
                yAnchor: 1.15
            });

            kakao.maps.event.addListener(marker, 'click', function() {
                if (currentOverlay) {
                    currentOverlay.setMap(null);
                }
                customOverlay.setMap(map);
                currentOverlay = customOverlay;
            });

            return marker;
        });

        clusterer.addMarkers(markers);
    }

    function renderCards(data) {
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        if(data.length === 0) {
            container.innerHTML = '<div class="loading-box">선택하신 카테고리에 해당하는 매장이 없습니다.</div>';
            return;
        }

        data.forEach(item => {
            const distText = item.distance >= 1000 
                ? (item.distance / 1000).toFixed(1) + ' km' 
                : Math.round(item.distance) + ' m';

            const targetUrl = getMapLink(item);
            const card = document.createElement('div');
            card.className = 'fran-card';
            
            card.onclick = function() {
                window.open(targetUrl, '_blank');
            };

            card.innerHTML = `
                <div class="fran-img-wrapper">
                    <img src="${item.image}" class="fran-img" alt="${item.name}">
                </div>
                <div class="fran-content">
                    <div>
                        <div class="badge-group">
                            <span class="badge ${item.badgeClass}">${item.badge}</span>
                            <span class="badge" style="background:#f1f5f9; color:#334155;">🏢 ${item.brandGroup}</span>
                            ${item.isHot ? '<span class="badge badge-hot">🔥 인기추천</span>' : ''}
                        </div>
                        <h3>${item.name}</h3>
                        <p class="fran-loc">📍 ${item.loc}</p>
                        <p class="fran-phone">📞 ${item.phone}</p>
                        <p class="fran-dist">🏃 약 ${distText} · ${item.tip}</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function applyCurrentFilterAndRender() {
        const activeBtn = document.querySelector('.filter-btn.active');
        let currentCategory = 'all';
        if(activeBtn) {
            const text = activeBtn.innerText;
            if(text.includes('인기추천')) currentCategory = 'hot';
            else if(text.includes('1.한식')) currentCategory = 'korean';
            else if(text.includes('2.치킨')) currentCategory = 'chicken_pizza';
            else if(text.includes('3.일식')) currentCategory = 'japanese';
            else if(text.includes('4.중식')) currentCategory = 'chinese';
            else if(text.includes('5.패스트푸드')) currentCategory = 'fast';
            else if(text.includes('6.분식')) currentCategory = 'bunsik';
            else if(text.includes('7.서양식')) currentCategory = 'western';
            else if(text.includes('8.카페')) currentCategory = 'cafe_dessert';
        }

        let targetData = masterFranchiseData;
        if(currentCategory === 'hot') {
            targetData = masterFranchiseData.filter(item => item.isHot);
        } else if(currentCategory !== 'all') {
            targetData = masterFranchiseData.filter(item => item.category === currentCategory);
        }

        renderCards(targetData);
        renderMarkersAndCluster(targetData);
    }

    function filterCategory(category, event) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if(event) event.target.classList.add('active');

        applyCurrentFilterAndRender();
    }

    window.onload = function() {
        if(typeof kakao !== 'undefined' && kakao.maps) {
            kakao.maps.load(initMap);
        }
    };
</script>

</body>
</html>
