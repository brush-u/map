    let map;
    let markers = [];
    let infowindows = [];
    let currentCenter = { lat: 37.5045, lng: 127.0485 };

    function initMap() {
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(currentCenter.lat, currentCenter.lng),
            level: 4
        };
        map = new kakao.maps.Map(mapContainer, mapOption);
        
        calculateDistances(currentCenter.lat, currentCenter.lng);
        renderCards(franchiseData);
        renderMarkers(franchiseData);
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function calculateDistances(lat, lng) {
        franchiseData.forEach(item => {
            item.distance = getDistance(lat, lng, item.lat, item.lng);
        });
    }

    function sortByMyPosition() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                
                currentCenter = { lat: userLat, lng: userLng };
                
                const moveLatLon = new kakao.maps.LatLng(userLat, userLng);
                map.setCenter(moveLatLon);

                calculateDistances(userLat, userLng);
                franchiseData.sort((a, b) => a.distance - b.distance);

                renderCards(franchiseData);
                renderMarkers(franchiseData);
                alert('📍 내 위치 기준 가장 가까운 매장순으로 정렬되었습니다!');
            }, function(error) {
                alert('위치 정보를 가져올 수 없습니다. 브라우저 위치 권한을 확인해주세요.');
            });
        } else {
            alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
        }
    }

    function renderMarkers(data) {
        markers.forEach(marker => marker.setMap(null));
        markers = [];
        infowindows = [];

        data.forEach((item) => {
            const coords = new kakao.maps.LatLng(item.lat, item.lng);
            const marker = new kakao.maps.Marker({
                map: map,
                position: coords
            });

            const content = `
                <div style="padding:10px;font-size:12px;width:190px;text-align:center;font-family:sans-serif;background:#fff;">
                    <strong style="font-size:13px;color:#0f172a;">${item.name}</strong><br>
                    <span style="color:#0284c7;font-size:11px;font-weight:600;">거리: ${item.distance >= 1000 ? (item.distance/1000).toFixed(1)+'km' : Math.round(item.distance)+'m'}</span><br>
                    <a href="${item.link}" target="_blank" style="display:inline-block;margin-top:6px;background:#2563eb;color:#fff;padding:4px 10px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">상세 페이지 이동 ➔</a>
                </div>
            `;
            
            const infowindow = new kakao.maps.InfoWindow({ content: content, removable: true });

            kakao.maps.event.addListener(marker, 'click', function() {
                infowindows.forEach(iw => iw.close());
                infowindow.open(map, marker);
            });

            markers.push(marker);
            infowindows.push(infowindow);
        });
    }

    function renderCards(data) {
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        data.forEach(item => {
            const distText = item.distance >= 1000 
                ? (item.distance / 1000).toFixed(1) + ' km' 
                : Math.round(item.distance) + ' m';

            const card = document.createElement('div');
            card.className = 'fran-card';
            
            card.onclick = function() {
                window.open(item.link, '_blank');
            };

            card.innerHTML = `
                <img src="${item.image}" class="fran-img" alt="${item.name}">
                <div class="fran-content">
                    <span class="badge ${item.badgeClass}">${item.badge}</span>
                    <h3>${item.name}</h3>
                    <p class="fran-loc">📍 ${item.loc}</p>
                    <p class="fran-dist">🏃 현 위치에서 약 ${distText}</p>
                    <div class="fran-details">
                        <span><strong>특징:</strong> ${item.tip} | <strong>추천:</strong> ${item.menu}</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterCategory(category, event) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if(event) event.target.classList.add('active');

        if(category === 'all') {
            renderCards(franchiseData);
            renderMarkers(franchiseData);
        } else {
            const filtered = franchiseData.filter(item => item.category === category);
            renderCards(filtered);
            renderMarkers(filtered);
        }
    }

    window.onload = function() {
        if(typeof kakao !== 'undefined' && kakao.maps) {
            kakao.maps.load(initMap);
        } else {
            renderCards(franchiseData);
        }
    };
</script>

</body>
</html>
